[workspace]
members = ["market", "trenchie_nft", "arena", "trenchie_rows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/papa-raw/near-trenchie-village"

[workspace.dependencies]
near-sdk = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
debug = 0

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
