<style>
  :root { --bottom-ui-scale: .8; --ink: #3B2F25; --paper: #FFF8EA; --mint: #9FDCC5; --sea: #D9EEEC; --gold: #F7CF6B; --danger: #E84855; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink); font: 14px/1.3 "Fredoka", ui-rounded, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  #world { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; will-change: transform; display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap; }
  .tag .name { font-weight: 600; font-size: 13px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 6px 10px 10px 6px; padding: 0 7px; box-shadow: 0 2px 0 rgba(59,47,37,.25); }
  .tag.lead .name { background: var(--mint); }

  .tag .hp i { display: block; height: 100%; background: #5FB79A; }
  .tag.low .hp i { background: var(--danger); }
  .tag.bench { opacity: .55; }

  .atag.lead { background: var(--mint); } .atag.lead::before { content: "\2605 "; color: #8A6A12; }
  .atag.bench { opacity: .6; } .atag.tag-hidden { opacity: 0; pointer-events: none; } .atag.narrow { font-size: 10px; padding: 0 4px 1px; }
  .inset { position: fixed; right: 18px; bottom: 86px; width: 280px; height: 210px; z-index: 4; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 rgba(59,47,37,.3); pointer-events: none; }
  .inset .cap { position: absolute; left: 8px; top: -13px; font: 600 12px/1.2 "Fredoka", ui-rounded, system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 0 7px; }
  .inset .x { position: absolute; right: -2px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 700 18px/1 system-ui, sans-serif; cursor: pointer; pointer-events: auto; padding: 0; }
  .inset .x:focus-visible { outline: 3px solid #6FA3D6; outline-offset: 2px; }
  .atag .dev { margin-left: 5px; padding: 0 4px; border-radius: 3px; background: var(--ink); color: var(--paper); font-size: 9px; font-weight: 700; letter-spacing: .06em; vertical-align: 1px; }

  #snapin-cta:hover .go { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }

  <img src="./snapin/img/satrenchi.png" alt="" width="144" height="149">
  <span class="say"><span class="cue-wrap"><span class="cue" id="snapin-cue"><b>Satrenchi:</b>Washed ashore? I’ll walk you in.</span></span><span class="go">Snap in your Trenchie</span></span>
</a>
<script>
  // The guide talks to the same arena this page watches: carry its ?ws= along, and say where "Keep watching" returns.
  (function () {
    var a = document.getElementById('snapin-cta'), q = new URLSearchParams(location.search), u = new URL(a.getAttribute('href'), location.href);

      // board 2's two leaderboards: the wall sign (data-panel="board", also caught above; named here so a change of host
      // never drops it). The last .ha-layer is no longer the leaderboard cards: since board 2 it is the HP candle layer,
      // whose candles ride the fighters, so reserving it made the button dodge moving bodies.
      document.querySelectorAll('.wallsign').forEach(add);
      document.querySelectorAll('.inset:not([hidden]), #status:not(.live), #chain-hold:not([hidden])').forEach(add);
      return out;
    }
    // The speech ticker's whole block, from geometry that does not change while the page runs: its bottom stands on the
    // frozen feed's full reserved top (social.mjs tickerBottom), its width is its max width, its height its full
    // three lines (two on a phone, wrapped). So the button picks its final spot at load and never hops.

      var s = document.querySelector('.arena-say-feed');

    // corner's arc and a short wedge points at Satrenchi's face. It is drawn from both elements' boxes, so it holds at every
    // placement and size. FACE: satrenchi.png's hood opening spans x 17-54%, y 30-60% of the sprite (measured): aim at its
    // right edge, half-way down, and stop short of it.

    function drawTail() {

    }

    // the button reserves exactly that and never moves as slips wrap; elsewhere the old reserve
    function feedReserve(feed, nw) { var r = parseFloat(feed.dataset.reserve); return (r > 0 ? r : (nw ? 52 : 100)) * UI_SCALE; }
    window.__ctaReserved = function () { return rects().map(function (r) { return { left: r.left, top: r.top, right: r.right, bottom: r.bottom }; }); };   // read by the review tooling
    function place() {
      var W = innerWidth, H = innerHeight, me = a.getBoundingClientRect(), w = me.width, h = me.height, m = W < 600 ? 10 : 16, hud = rects();
      var feed = document.querySelector('#world [data-panel="feed"]'), btn = document.querySelector('#world [data-panel="btn1"]');
      var feedTop = feed ? Math.min(feed.getBoundingClientRect().top, feed.getBoundingClientRect().bottom - feedReserve(feed, W < 600)) : H - m, btnTop = btn ? btn.getBoundingClientRect().top : H - m;

      var freeBox = function (x, y, bw, bh) {

        return !hud.some(function (r) { return x < r.right + GAP && x + bw > r.left - GAP && y < r.bottom + GAP / 2 && y + bh > r.top - GAP / 2; });
      };

      if (forceSpot != null && spots[forceSpot]) pick = spots[forceSpot];   // ?ctaspot=N: show placement N, for review
      if (key !== last || forceSpot != null) { last = key; a.style.setProperty('--cta-x', Math.round(pick[0]) + 'px'); a.style.setProperty('--cta-y', Math.round(pick[1]) + 'px'); }
      drawTail();
      // the compact order box: the first spot that touches nothing of the HUD, the call to action or the ring (its outline
      // as the arena draws it); above the call to action, then the free corners. Nowhere free: hidden, and Satrenchi points
      // to Your trenchie, where the full box is.
      if (mini && miniWanted && W < 600) {

        mini.hidden = true; if (miniFits !== false) { miniFits = false; if (onMiniFit) onMiniFit(); }
      } else if (mini && miniWanted) {

        // between two runs, and has picked the same spot twice: before that the HUD is still arriving, spots look free that
        // are not, and the box would flash over the fight
        var panels = document.querySelectorAll('#world [data-panel]:not([data-kind="world"])'), ring = window.__arenaRingOutline ? window.__arenaRingOutline() : null, sized = function (el) { var r = el && el.getBoundingClientRect(); return !!(r && r.width > 0 && r.height > 0); };

        hudQuiet++;

    addEventListener('resize', place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    place(); setInterval(place, 500);

    // A visitor who already snapped in: this page keeps driving their fighter (its lease is renewed while a page is

    var s = document.createElement('script'); s.src = './snapin/room.js';
    s.onload = function () {

      var ch = document.createElement('script'); ch.src = './snapin/chat.js'; document.body.appendChild(ch);

      };
